name: fetch-transfer
on:
  push:
    branches: ['xfer-*']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download listed urls
        run: |
          set -e
          mkdir -p gen
          while read -r url; do
            [ -z "$url" ] && continue
            curl -fsSL "$url" -o "gen/$(basename "${url%%\?*}")"
          done < urls.txt
          ls -la gen
      - name: commit
        run: |
          git config user.name "transfer-bot"
          git config user.email "transfer-bot@users.noreply.github.com"
          git add gen
          git commit -m "fetched transfer files" || echo "nothing to commit"
          git push
